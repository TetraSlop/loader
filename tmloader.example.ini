# Copy to tmloader.ini and adjust. Command-line options override these values.
# A relative runtime-dir is resolved against this file.
runtime-dir=runtime
server=tm.example.com
game-port=51241
profile-port=51220
# Your account. Leave these out and the loader asks for them, then saves them here.
# A username the server does not know yet becomes a new account on first login.
# username=Player_1
# password=your password
# A local tmserver's built-in test account instead (server must be 127.0.0.1):
# local-account=true
diagnostics=false
