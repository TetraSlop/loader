name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push to a PR supersedes the run; main runs release steps and always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Release please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Check for a release awaiting publication
        id: draft
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pending=$(gh release list --limit 30 --json isDraft --jq 'any(.[]; .isDraft)')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      # Drafts are not yet release-please's baseline for the next version.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: pr
        if: steps.release.outputs.release_created != 'true' && steps.draft.outputs.pending == 'false'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - name: Check the generated release PR
        if: steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.pr.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<< "$RELEASE_PR")
          branch=$(gh pr view "$number" --json headRefName --jq '.headRefName')
          gh workflow run ci.yml --ref "$branch"

  build:
    name: Windows x86
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_TYPE: Release
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release can target an earlier merged PR; build its exact commit.
          ref: ${{ needs.release.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/ci_requirements.txt
      - name: Install test tools
        run: python -m pip install -r tools/ci_requirements.txt
      - name: Check C++ formatting
        run: python tools/run_clang_format.py --check
      # Ninja needs the compiler environment that the Visual Studio generator finds itself.
      - name: Load the MSVC x86 environment
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" x86 >nul && set" |
            Where-Object { $_ -notmatch '^(GITHUB|RUNNER)_' } | Add-Content $env:GITHUB_ENV
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.19.0
      # One entry per run, so the newest objects are kept; restore the latest for this branch or main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-
      - name: Configure C++23 x86 build
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build loader and tests
        run: cmake --build build
      - name: Run C++ tests without a graphics device
        run: ctest --test-dir build --output-on-failure --timeout 60 -LE graphics-device
      - name: Compiler cache statistics
        run: sccache --show-stats
      - name: Run Python tool and packaging tests
        run: python -m unittest discover -s tests/tools -v
      # Also checks the loader's PE headers, and that tmloader --check in the extracted archive
      # starts and rejects placeholder DLLs. No game files are needed.
      - name: Build and verify the client archive
        run: python tools/build_release.py --loader build/tmloader.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-client-archive
          path: out/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish the verified archive
    needs: [release, build]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-client-archive
          path: release
      - name: Attach the archive and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        working-directory: release
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt validation.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
